version: 2
updates:
  # Frontend — npm
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Backend — Maven
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # GitHub Actions versions (scans .github/workflows)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Backend Docker base image (backend/Dockerfile)
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
