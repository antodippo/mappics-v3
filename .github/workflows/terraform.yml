name: Terraform — Plan & Apply

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

jobs:
  terraform:
    name: ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest

    # pull-requests: write is needed to post the plan as a PR comment
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    defaults:
      run:
        working-directory: infrastructure/gcp

    env:
      # Terraform variable injection — all TF_VAR_* are picked up automatically
      TF_VAR_project_id:            ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region:                ${{ vars.GCP_REGION }}
      TF_VAR_firestore_location:    ${{ vars.GCP_REGION }}
      TF_VAR_source_bucket_name:    ${{ vars.TF_SOURCE_BUCKET }}
      TF_VAR_processed_bucket_name: ${{ vars.TF_PROCESSED_BUCKET }}
      # github.repository is "owner/repo" — exactly the format the variable expects
      TF_VAR_github_repository:     ${{ github.repository }}
      TF_VAR_import_secret:         ${{ secrets.TF_IMPORT_SECRET }}

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── 2. GCP authentication ────────────────────────────────────────────────
      # Uses a dedicated Terraform service account (broader permissions than cicd SA).
      # Bootstrap note: TERRAFORM_SERVICE_ACCOUNT must be set AFTER the first
      # manual `terraform apply` that creates the mappics-terraform SA.
      # Required GitHub secrets:  WIF_PROVIDER, TERRAFORM_SERVICE_ACCOUNT
      # Required GitHub variables: GCP_PROJECT_ID, GCP_REGION,
      #                            TF_SOURCE_BUCKET, TF_PROCESSED_BUCKET,
      #                            TF_STATE_BUCKET
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.TERRAFORM_SERVICE_ACCOUNT }}

      # ── 3. Terraform setup ───────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.5'

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -input=false

      # ── 4. Validate & format ─────────────────────────────────────────────────
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      # ── 5. Plan ──────────────────────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true  # let us post the comment even on failure

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_STDERR: ${{ steps.plan.outputs.stderr }}
        with:
          script: |
            const raw = process.env.PLAN_STDOUT || process.env.PLAN_STDERR || '(no output)';
            const plan = raw.length > 60000
              ? raw.substring(0, 60000) + '\n\n… output truncated (> 60 000 chars)'
              : raw;

            const icon    = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            const outcome = '${{ steps.plan.outcome }}';

            const body = [
              `#### Terraform Plan ${icon} \`${outcome}\``,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by @${{ github.actor }} on \`${{ github.event_name }}\`*`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # ── 6. Apply ─────────────────────────────────────────────────────────────
      # Only runs on a push to main (i.e. after a PR is merged).
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false tfplan
