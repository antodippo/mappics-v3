name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # v1, not @beta: @beta does not accept `prompt`/`claude_args`, so it silently
      # ignored the review instructions and exited 0 without reviewing anything.
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and adherence to this repo's conventions (see CLAUDE.md)
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            IMPORTANT: You MUST always post exactly one top-level comment with `gh pr comment`,
            even when you find nothing to report. This is non-negotiable - the comment is how we
            confirm the review actually ran. The comment must:
            - start with the heading "## Claude review"
            - end with a one-line verdict (e.g. "No issues found")
            - have this exact marker as its very last line, copied verbatim:
              <!-- claude-review: ${{ github.event.pull_request.head.sha }} -->

            Be concise. A few lines is the target and a clean PR should be two or three.
            Don't restate the diff, don't enumerate the categories you checked, and don't
            pad with praise - reviewers read every one of these, so only write what changes
            what they do. Raise something only if it's worth their time to act on.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Speaks up only when the review did NOT happen. On a clean run Claude's own
      # review comment is the proof it ran, so adding a second one is just noise.
      - name: Post review status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER='<!-- claude-review-status -->'
          COMMENTS=$(gh api "repos/$REPO/issues/$PR/comments" --paginate)

          # Did Claude actually post its review for *this* commit? A green step is not proof.
          REVIEWS=$(printf '%s' "$COMMENTS" \
                    | jq -r ".[] | select(.body | contains(\"<!-- claude-review: $SHA -->\")) | .id")

          IDS=$(printf '%s' "$COMMENTS" \
                | jq -r '.[] | select(.body | startswith("<!-- claude-review-status -->")) | .id')
          ID=$(printf '%s\n' "$IDS" | head -n1)

          if [ "$OUTCOME" != "success" ]; then
            TEXT="⚠️ Claude auto review did **not** complete on \`${SHA:0:7}\` (step outcome: \`$OUTCOME\`). No review feedback was posted. ([run log]($RUN_URL))"
          elif [ -z "$REVIEWS" ]; then
            TEXT="⚠️ Claude auto review ran on \`${SHA:0:7}\` but posted **no review comment** — treat this PR as unreviewed. ([run log]($RUN_URL))"
          else
            # Clean run: stay quiet, but clear a warning left by an earlier push so it
            # doesn't keep claiming the PR is unreviewed.
            if [ -n "$ID" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$ID" \
                -f body="$MARKER
          ✅ Resolved - Claude reviewed \`${SHA:0:7}\`. ([run log]($RUN_URL))"
            fi
            exit 0
          fi
          BODY=$(printf '%s\n%s' "$MARKER" "$TEXT")

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$BODY"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY"
          fi
