name: Frontend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    # No path filter on PRs: the Build check job must always run so it can be a
    # required status check for Dependabot auto-merge without deadlocking
    # PRs that don't touch frontend/**.
  workflow_dispatch: # allow manual re-deploy without a code change

jobs:
  check:
    name: Build check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      # Node 22 is a hard floor, not a preference: jsdom >= 30 requires
      # ^22.22.2 || ^24.15.0 || >=26.0.0 and pulls undici 8, which calls
      # worker_threads.markAsUncloneable (added in Node 22.10). On Node 20 every
      # vitest worker crashes before a test runs.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # ── 3. Test ──────────────────────────────────────────────────────────────
      # Vitest runtime tests (jsdom). Catches runtime rendering/behavior
      # regressions from dependency bumps that a clean compile would miss — this
      # is the gate that makes Dependabot auto-merge safe.
      - name: Test
        run: npm test
        working-directory: frontend

      # ── 4. Build ─────────────────────────────────────────────────────────────
      # VITE_API_BASE_URL is intentionally empty here — validates the bundle
      # compiles without errors. The deploy job sets the real URL.
      - name: Build
        run: npm run build
        working-directory: frontend

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # id-token: write is required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # ── 3. GCP authentication ────────────────────────────────────────────────
      # Uses the same Workload Identity Federation setup as the backend pipeline.
      # Required GitHub secrets:  WIF_PROVIDER, CICD_SERVICE_ACCOUNT
      # Required GitHub variables: GCP_PROJECT_ID, GCP_REGION
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CICD_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ── 4. Resolve backend URL ───────────────────────────────────────────────
      # Fetch the live Cloud Run URL so VITE_API_BASE_URL is always up to date.
      # The backend pipeline must have run at least once before this step works.
      - name: Get Cloud Run URL
        id: backend
        run: |
          URL=$(gcloud run services describe mappics-backend \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend URL: $URL"

      # ── 5. Build ─────────────────────────────────────────────────────────────
      # VITE_API_BASE_URL is baked into the bundle at build time.
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.backend.outputs.url }}

      # ── 6. Deploy to Firebase Hosting ────────────────────────────────────────
      # The Firebase CLI uses Application Default Credentials set by the auth
      # step above. The mappics-cicd service account has firebasehosting.admin.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}"
        working-directory: frontend
