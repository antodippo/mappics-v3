name: Backend — Test, Build, Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch: # allow manual re-deploy without a code change

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java ─────────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # caches ~/.m2 between runs

      # ── 3. Tests ────────────────────────────────────────────────────────────
      # Runs unit tests (Surefire) + Firestore emulator integration test (Failsafe).
      # Docker is pre-installed on ubuntu-latest runners, so Testcontainers works
      # without the Docker Desktop socket workaround needed on macOS.
      - name: Run tests
        run: ./mvnw clean verify -B
        working-directory: backend

  build-deploy:
    name: Build → Deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # id-token: write is required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE:  ${{ vars.ARTIFACT_REGISTRY_URL }}/mappics-backend

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. GCP authentication ────────────────────────────────────────────────
      # Uses Workload Identity Federation — no long-lived service account keys.
      # Required GitHub secrets:  WIF_PROVIDER, CICD_SERVICE_ACCOUNT
      # Required GitHub variables: GCP_PROJECT_ID, GCP_REGION, ARTIFACT_REGISTRY_URL
      # Values come from `terraform output` after applying infrastructure/gcp/.
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CICD_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── 3. Docker ────────────────────────────────────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Reuse layers from previous runs via the GitHub Actions cache
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── 4. Deploy ────────────────────────────────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mappics-backend \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --quiet

      - name: Print service URL
        run: |
          gcloud run services describe mappics-backend \
            --region="${{ env.REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(status.url)"
