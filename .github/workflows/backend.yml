name: Backend — Test, Build, Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    # No path filter on PRs: the Test job must always run so it can be a
    # required status check for Dependabot auto-merge without deadlocking
    # PRs that don't touch backend/**.
  workflow_dispatch: # allow manual re-deploy without a code change

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── 2. Java ─────────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # caches ~/.m2 between runs

      # ── 3. Tests ────────────────────────────────────────────────────────────
      # Runs unit tests (Surefire) + Firestore emulator integration test (Failsafe).
      # Docker is pre-installed on ubuntu-latest runners, so Testcontainers works
      # without the Docker Desktop socket workaround needed on macOS.
      - name: Run tests
        run: ./mvnw clean verify -B
        working-directory: backend

  mutation-test:
    name: Mutation test
    # Runs on every trigger, in parallel with `test` (no `needs`) and without a
    # path filter, mirroring `test`. Fails if the mutation score drops below the
    # threshold in pom.xml; the HTML report is uploaded as a workflow artifact
    # either way. Unit tests only — no Docker needed.
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run mutation tests (PIT)
        run: ./mvnw test-compile pitest:mutationCoverage -B
        working-directory: backend

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-mutation-report
          path: backend/target/pit-reports
          retention-days: 30

  build-image:
    name: Build image
    # PR-only: catches Dockerfile / base-image regressions (e.g. a tool missing
    # from a bumped base image) before merge, since build-deploy only builds on
    # push to main. Runs in parallel with `test` (no `needs`) and without a path
    # filter, mirroring `test`, so it can be a required check without deadlocking
    # non-backend PRs. Builds only — no push, so no GCP credentials are needed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          platforms: linux/amd64        # match Cloud Run; native on the runner
          # Share the layer cache with the build-deploy job on main
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  build-deploy:
    name: Build → Deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # id-token: write is required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE:  ${{ vars.ARTIFACT_REGISTRY_URL }}/mappics-backend

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── 2. GCP authentication ────────────────────────────────────────────────
      # Uses Workload Identity Federation — no long-lived service account keys.
      # Required GitHub secrets:  WIF_PROVIDER, CICD_SERVICE_ACCOUNT
      # Required GitHub variables: GCP_PROJECT_ID, GCP_REGION, ARTIFACT_REGISTRY_URL
      # Values come from `terraform output` after applying infrastructure/gcp/.
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CICD_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ── 3. Docker ────────────────────────────────────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Reuse layers from previous runs via the GitHub Actions cache
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── 4. Deploy ────────────────────────────────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mappics-backend \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --quiet

      # The import runs as a Cloud Run Job (mappics-import-job), not on the
      # web service. Keep its image in sync with each deploy. `jobs deploy` is
      # create-or-update, so it succeeds even if this pipeline runs before the
      # Terraform pipeline has created the job.
      - name: Deploy import Cloud Run Job
        run: |
          gcloud run jobs deploy mappics-import-job \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --quiet

      - name: Print service URL
        run: |
          gcloud run services describe mappics-backend \
            --region="${{ env.REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(status.url)"
