# Production profile — uses real GCP adapters.
# All env vars must be set in the Cloud Run service configuration.
spring.cloud.gcp.project-id=${GCP_PROJECT_ID}

mappics.bucket.source=${MAPPICS_SOURCE_BUCKET}
mappics.bucket.processed=${MAPPICS_PROCESSED_BUCKET}

# Emit structured JSON so Cloud Logging parses severity and MDC keys are filterable in Log Explorer.
# Filter by import in Log Explorer: jsonPayload.importJobId="<id>"
logging.structured.format.console=logstash
