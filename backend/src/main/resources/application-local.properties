# Local development profile — uses in-memory and stub adapters.
# No GCP credentials required; all GCP auto-configurations are excluded.
server.port=8081
spring.autoconfigure.exclude=\
  com.google.cloud.spring.autoconfigure.core.GcpContextAutoConfiguration,\
  com.google.cloud.spring.autoconfigure.firestore.GcpFirestoreAutoConfiguration,\
  com.google.cloud.spring.autoconfigure.storage.GcpStorageAutoConfiguration

# No rate limiting needed when using the stub HTTP client
mappics.import.osm-rate-limit-ms=0

# Path to JPEG fixtures for the local dev seeder (relative to the backend/ working directory).
# Override with an absolute path if you run the app from a different directory.
# mappics.local.galleries-path=src/test/resources/galleries
