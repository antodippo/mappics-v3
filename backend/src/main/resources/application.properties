spring.application.name=mappics
server.port=8080

logging.level.com.antodippo.mappics=DEBUG

# OSM Nominatim ToS: max 1 request/second during batch import
mappics.import.osm-rate-limit-ms=1000

# Whether POST /import runs the import in-process (on the web server).
# true in local/dev; false in prod, where the import runs as the
# `mappics-import-job` Cloud Run Job (the web service CPU is throttled while idle).
mappics.import.in-process=true

# Expose only the health endpoint (used by Cloud Run startup/liveness probes)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
