services:

  # Spring Boot backend in local mode — seeds galleries from test fixtures on startup.
  # The frontend is run separately with `npm run dev` (see README).
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # Relative to /app (the container working dir); override if fixtures live elsewhere.
      MAPPICS_LOCAL_GALLERIES_PATH: src/test/resources/galleries
    # Mount fixture JPEGs so LocalDevSeeder can seed galleries without a GCS bucket.
    # The Dockerfile only copies the JAR; fixtures must be provided via this mount.
    volumes:
      - ./backend/src/test/resources/galleries:/app/src/test/resources/galleries:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional: Firestore emulator for integration tests without a real GCP project.
  # Uncomment if you want a persistent emulator alongside the backend.
  #
  # firestore:
  #   image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
  #   command: gcloud beta emulators firestore start --host-port=0.0.0.0:8200
  #   ports:
  #     - "8200:8200"
